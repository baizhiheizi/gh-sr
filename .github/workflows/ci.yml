name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test
    runs-on: [self-hosted, linux]
    steps:
      # Shared runner workspaces occasionally end up with a stale .git that
      # actions/checkout can neither reuse ("not a git repository") nor
      # delete (EACCES on root-owned .git/objects/info/commit-graphs/*),
      # failing the job at checkout. rm -rf hits the same EACCES, but rename
      # only needs write access to the workspace itself: move the broken .git
      # into RUNNER_TEMP so the checkout below starts from a fresh clone.
      - name: Repair stale workspace
        run: |
          if [ -e .git ] && ! git rev-parse --git-dir >/dev/null 2>&1; then
            mv .git "${RUNNER_TEMP}/broken-git.$(date +%s%N)"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -count=1

  bench:
    name: bench
    runs-on: [self-hosted, linux]
    # Only on push: bench-compare.yml already benchmarks every PR (with
    # per-PR package scoping), and this job's artifact is only consumed from
    # main runs — running it on PRs too just doubles bench load on the one
    # self-hosted runner and adds the contention that makes timings flap.
    if: github.event_name == 'push'
    steps:
      # Same stale-workspace repair as the test job above.
      - name: Repair stale workspace
        run: |
          if [ -e .git ] && ! git rev-parse --git-dir >/dev/null 2>&1; then
            mv .git "${RUNNER_TEMP}/broken-git.$(date +%s%N)"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      # -count=3 + median aggregation (in scripts/benchstat) must match
      # bench-compare.yml exactly: this artifact is the comparison BASELINE,
      # and a single-sample baseline flaps ±30-66% under runner contention.
      # -benchtime=500ms keeps the 3× repetition cost at ~1.5× the old
      # single 1s-per-benchmark run.
      - name: Benchmark
        run: go test ./... -run='^$' -bench=. -benchmem -count=3 -benchtime=500ms | tee bench.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          retention-days: 90
